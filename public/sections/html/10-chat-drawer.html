  <div class="chat-drawer" id="chat-drawer">
    <div class="chat-header">
      <div>
        <h3>Team Collaboration</h3>
        <div class="status-lbl">All members online</div>
      </div>
      <button class="icon-btn" id="chat-drawer-close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="chat-messages" id="chat-messages-container"></div>
    <div class="chat-typing-indicator" id="chat-typing-indicator" style="display:none;">
      <div class="dots"><span></span><span></span><span></span></div>
      <span id="chat-typing-text">Team member is typing...</span>
    </div>
    <form class="chat-input-area" id="chat-send-form">
      <input type="text" id="chat-input" placeholder="Message your team..." autocomplete="off" />
      <button type="submit" class="btn btn-primary btn-small">
        <span class="material-symbols-outlined">send</span>
      </button>
    </form>
  </div>
